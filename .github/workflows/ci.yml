name: Aperture RAG CI
on: [push, pull_request]
env:
  DO_NOT_TRACK: '1'
  MLFLOW_DISABLE_AGENT_HINT: '1'
jobs:
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: enterprise_rag
          POSTGRES_USER: enterprise_rag
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U enterprise_rag" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt
      - run: python -m pytest -q backend/tests
      - run: python -m pytest -q backend/tests
        env:
          TEST_DATABASE_URL: postgresql://enterprise_rag:ci-only-password@localhost:5432/enterprise_rag
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm run build
        working-directory: frontend
  semantic-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/cache@v4
        with: {path: runtime/model-cache, key: minilm-1110a243-rag-v1}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt
      - run: python scripts/bootstrap.py
        env: {HF_HOME: '${{ github.workspace }}/runtime/model-cache'}
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: |
          PYTHONPATH=backend RAG_DEMO_MODE=true HF_HOME="$PWD/runtime/model-cache" uvicorn rag.main:app --host 127.0.0.1 --port 8300 >/tmp/rag-api.log 2>&1 &
          cd frontend
          npm run dev >/tmp/rag-dashboard.log 2>&1 &
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8300/api/health && curl -fsS http://127.0.0.1:5177/ && break; sleep 2; done
          npm run test:e2e
      - run: python scripts/demo_rollouts.py
      - uses: actions/upload-artifact@v4
        with: {name: measured-rag-evaluations, path: reports/*.json}
      - run: cat /tmp/rag-api.log /tmp/rag-dashboard.log
        if: failure()
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - run: |
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:9101/minio/health/live && curl -fsS http://127.0.0.1:8300/api/health && break; sleep 2; done
          docker compose exec -T api python scripts/bootstrap.py
      - run: python scripts/demo_rollouts.py
      - run: |
          curl --fail http://127.0.0.1:5177/
          curl --fail http://127.0.0.1:5002/health
          curl --fail http://127.0.0.1:3002/api/health
          curl --fail http://127.0.0.1:8300/metrics
      - run: docker compose logs --tail 100
        if: failure()
      - run: docker compose down -v
        if: always()
