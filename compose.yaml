services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: enterprise_rag
      POSTGRES_USER: enterprise_rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_rag"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["127.0.0.1:9101:9000", "127.0.0.1:9102:9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-aperture-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-local-development-only}
    volumes: ["objects:/data"]
  mlflow:
    build: .
    command: ["mlflow", "server", "--backend-store-uri", "sqlite:////runtime/mlflow.db", "--host", "0.0.0.0", "--port", "5000", "--workers", "1", "--allowed-hosts", "localhost:5002,127.0.0.1:5002,localhost:5000,127.0.0.1:5000,mlflow:5000"]
    ports: ["127.0.0.1:5002:5000"]
    volumes: ["runtime:/runtime"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health',timeout=5)"]
      interval: 5s
      retries: 30
  api:
    build: .
    ports: ["127.0.0.1:8300:8300"]
    environment:
      DATABASE_URL: postgresql://enterprise_rag:${POSTGRES_PASSWORD:-local-development-only}@postgres:5432/enterprise_rag
      MLFLOW_TRACKING_URI: sqlite:////runtime/mlflow.db
      RAG_DEMO_MODE: ${RAG_DEMO_MODE:-true}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: aperture-documents
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-aperture-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-local-development-only}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8001/v1}
      LLM_MODEL: ${LLM_MODEL:-configured-model}
      LLM_API_KEY: ${LLM_API_KEY:-}
      INPUT_COST_PER_MILLION: ${INPUT_COST_PER_MILLION:-}
      OUTPUT_COST_PER_MILLION: ${OUTPUT_COST_PER_MILLION:-}
    volumes: ["runtime:/runtime"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      mlflow: {condition: service_healthy}
      minio: {condition: service_started}
  dashboard:
    build: ./frontend
    ports: ["127.0.0.1:5177:80"]
    depends_on: [api]
  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["127.0.0.1:9092:9090"]
    volumes: ["./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./configs/alerts.yml:/etc/prometheus/alerts.yml:ro"]
  grafana:
    image: grafana/grafana:12.0.2
    ports: ["127.0.0.1:3002:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-development-only}
    volumes: ["./configs/grafana/provisioning:/etc/grafana/provisioning:ro", "./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    depends_on: [prometheus]
volumes:
  postgres:
  runtime:
  objects:
